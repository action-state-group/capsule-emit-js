# SPDX-License-Identifier: Apache-2.0
# Vector-suite CI — the 60-vector conformance suite is the acceptance gate.
# 27 CPB conformance vectors (jcs-n KATs, derived-id, typed-refs, profile-independence)
# + 33 AAC conformance assertions (32 capsule vectors via verify/verify_store).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vector-suite:
    name: "vector suite (Node ${{ matrix.node }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Run vector suite (60 vectors)
        run: npm test
